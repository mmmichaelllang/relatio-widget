<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pedagogical Architecture — Inverted Root System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400;700&display=swap');

:root {
    --accent:     #c8ff00;
    --accent-dim: rgba(200,255,0,0.22);
    --font-sans:  'Space Mono', monospace;
    --font-serif: 'Playfair Display', serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/*
 * ═══════════════════════════════════════════════════════════════
 * MOBILE IFRAME SCROLL SUPPRESSION — layered strategy
 *
 * 1. overflow: clip  (not hidden)
 *    Unlike overflow:hidden, clip forbids ALL scrolling mechanics
 *    including programmatic scrollTo(). Does not establish a new
 *    BFC unless combined with display:flow-root, so it's lighter
 *    on the paint pipeline. overflow-clip-margin:0 pins the clip
 *    edge exactly to the padding-box — no bleed.
 *
 * 2. Scrollbar hiding (webkit / Firefox / legacy IE+Edge)
 *    display:none on ::-webkit-scrollbar removes the track/thumb
 *    in Chrome/Safari. scrollbar-width:none covers Firefox.
 *    -ms-overflow-style:none covers legacy IE/Edge.
 *    Applied to both html and body for full coverage.
 *
 * 3. scrollbar-gutter: stable
 *    Reserves the scrollbar lane even when no scrollbar is shown,
 *    preventing layout shift if the clip edge is ever breached by
 *    a glow/filter overflow.
 *
 * 4. touch-action: pan-y  +  pointer-events: none  (body)
 *    Tells Android Chrome "no internal scroll" → passes gestures
 *    to the parent page. document-level JS (postMessage relay)
 *    is unaffected by pointer-events:none on the body element.
 * ═══════════════════════════════════════════════════════════════
 */

/* ── Scrollbar hiding: WebKit (Chrome, Safari, newer Edge) ── */
html::-webkit-scrollbar,
body::-webkit-scrollbar { display: none; }

html {
    background-color: #003300;

    /* overflow: clip — stronger than hidden; no programmatic scroll escape */
    overflow: clip;
    overflow-clip-margin: 0px;

    /* Reserve scrollbar gutter so filter glows don't shift layout */
    scrollbar-gutter: stable;

    /* Hide scrollbar: Firefox */
    scrollbar-width: none;
    /* Hide scrollbar: legacy IE / pre-Chromium Edge */
    -ms-overflow-style: none;

    touch-action: pan-y;
    overscroll-behavior: none;
}

body {
    background-color: #003300;
    font-family: var(--font-sans);
    color: #fff;
    width: 100%;
    margin: 0;
    padding: 0;

    /* overflow: clip on body as well — belt-and-suspenders */
    overflow: clip;
    overflow-clip-margin: 0px;

    scrollbar-gutter: stable;
    scrollbar-width: none;
    -ms-overflow-style: none;

    touch-action: pan-y;
    overscroll-behavior: none;
    display: flex;
    justify-content: center;
    align-items: flex-start;

    /* pointer-events:none → Android Chrome passes touches to parent page.
       document-level JS listener still fires (CSS pointer-events doesn't
       suppress native DOM event dispatch at document/window scope). */
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
}

body::before {
    content: '';
    position: fixed; inset: 0;
    background:
        radial-gradient(ellipse 75% 60% at 50% 50%, rgba(0,80,0,0.42), transparent 70%),
        radial-gradient(ellipse 50% 40% at 30% 70%, rgba(0,45,10,0.22), transparent),
        radial-gradient(ellipse 55% 45% at 75% 35%, rgba(20,60,0,0.18), transparent);
    animation: auroraShift 10s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
}
@keyframes auroraShift {
    from { opacity: 0.6; transform: scale(1); }
    to   { opacity: 1;   transform: scale(1.04); }
}

.glass-card {
    position: relative; z-index: 1;
    background: transparent;
    padding: 0;
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 620px;
    gap: 0.1rem;
}

.svg-container {
    width: 100%; height: auto;
    display: block;
}

/* ── TRACK STYLES ── */
.track-base {
    fill: none;
    stroke: rgba(200,255,0,0.10);
    stroke-width: 2.5;
    stroke-linecap: round;
}
.track-flow {
    fill: none; stroke: var(--accent);
    stroke-width: 1.5; stroke-linecap: round;
    stroke-dasharray: 5 24;
    animation: dashFlow 2s linear infinite;
    opacity: 0.85;
}
.track-flow-slow {
    fill: none; stroke: rgba(200,255,0,0.28);
    stroke-width: 2.5; stroke-linecap: round;
    stroke-dasharray: 2 44;
    animation: dashFlowSlow 5s linear infinite;
}
.track-return {
    fill: none;
    stroke: rgba(200,255,0,0.22);
    stroke-width: 1.2; stroke-linecap: round;
    stroke-dasharray: 3 9;
    animation: dashReturn 3.5s linear infinite;
}

@keyframes dashFlow     { to { stroke-dashoffset: -29; } }
@keyframes dashFlowSlow { to { stroke-dashoffset: -46; } }
@keyframes dashReturn   { to { stroke-dashoffset: -12; } }
@keyframes dashNeonRet  { to { stroke-dashoffset: -14; } }

.node-core-dot {
    transform-box: fill-box;
    transform-origin: center;
    animation: coreBreath 3.2s ease-in-out infinite;
}
@keyframes coreBreath {
    0%, 100% { transform: scale(1);    }
    50%      { transform: scale(1.45); }
}

.pulse-ring-a,
.pulse-ring-b {
    fill: none;
    transform-box: fill-box;
    transform-origin: center;
}
.pulse-ring-a { animation: pulseRing 3s ease-out infinite; }
.pulse-ring-b { animation: pulseRing 3s ease-out infinite -1.5s; }
@keyframes pulseRing {
    0%   { transform: scale(1);    opacity: 0.65; }
    100% { transform: scale(2.83); opacity: 0;    }
}

/* ── SVG LABELS ── */
.lbl-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 17px;
    fill: #ffffff;
    letter-spacing: 0.035em;
    filter: url(#textHalo);
}
.lbl-sub {
    font-family: var(--font-sans);
    font-size: 9.5px;
    fill: #7ac47a;
    letter-spacing: 0.15em;
    filter: url(#textHalo);
}

/* ── CAPTION ── */
.caption-box {
    position: relative; z-index: 1;
    border-top: 1px dashed rgba(200,255,0,0.20);
    padding: 0.35rem 0.4rem 0.4rem;
    text-align: center;
    width: 100%;
}
.caption-text {
    font-family: var(--font-sans);
    font-size: 11.5px;
    color: rgba(220,255,220,0.75);
    line-height: 1.75;
    letter-spacing: 0.02em;
    max-width: 520px;
    margin: 0 auto;
}

/* ── HIGHLIGHTERS ── */
strong.hl-v1, strong.hl-v2, strong.hl-v3 {
    font-family: var(--font-serif);
    font-weight: 700;
    color: #000;
    background-size: 100% 108%;
    background-position: center;
    background-repeat: no-repeat;
    padding: 0 0.18rem;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    text-shadow: 1px 1px 0.5px rgba(255,255,255,0.35);
    transition: background-size 0.3s ease;
}
strong.hl-v1 {
    background-image: linear-gradient(104deg,
        rgba(255,221,0,0) .05%,   rgba(255,221,0,.85) 2.4%,
        rgba(255,221,0,.60) 5.8%, rgba(255,221,0,.80) 93%,
        rgba(255,221,0,0) 99.95%);
    border-radius: 3px 8px 10px 4px;
}
strong.hl-v2 {
    background-image: linear-gradient(104deg,
        rgba(255,221,0,0) .01%,  rgba(255,221,0,.90) 2.4%,
        rgba(255,221,0,.70) 12%, rgba(255,221,0,.85) 88%,
        rgba(255,221,0,0) 99.99%);
    border-radius: 5px 2px 8px 6px;
}
strong.hl-v3 {
    background-image: linear-gradient(104deg,
        rgba(255,221,0,0) .08%,   rgba(255,221,0,.70) 2.4%,
        rgba(255,221,0,.40) 5.8%, rgba(255,221,0,.70) 93%,
        rgba(255,221,0,0) 99.92%);
    border-radius: 2px 9px 5px 3px;
}
strong.hl-v1:hover,
strong.hl-v2:hover,
strong.hl-v3:hover { background-size: 100% 122%; }
</style>
</head>

<!--
  TOUCH SCROLL RELAY — iOS Safari fix
  ─────────────────────────────────────────────────────────────────────────
  pointer-events:none on <body> covers Android Chrome (passes gestures
  straight to parent page). iOS Safari ignores that CSS at the iframe
  boundary level, so this script relays touch deltas via postMessage.

  Companion script required in a second Google Sites HTML embed:
  ┌─────────────────────────────────────────────────────────────────────┐
  │ <script>                                                            │
  │ (function(){                                                        │
  │   var target = 0;                                                   │
  │   window.addEventListener('message', function(e){                  │
  │     if(!e.data) return;                                             │
  │     if(e.data.type==='iframeScrollInit'){                           │
  │       target = window.scrollY;                                      │
  │       e.source.postMessage({type:'iframeScrollAck',y:target},'*'); │
  │     }                                                               │
  │     if(e.data.type==='iframeScrollTo'){                             │
  │       target = e.data.y;                                            │
  │       window.scrollTo({top:target,behavior:'instant'});             │
  │     }                                                               │
  │   });                                                               │
  │ }());                                                               │
  │ </script>                                                           │
  └─────────────────────────────────────────────────────────────────────┘
  The embed can be a 1px-tall HTML block anywhere on the Sites page.
-->
<script>
(function () {
  var lastY = 0, lastX = 0;
  var parentScrollY = 0;      // synced from parent on touchstart
  var synced = false;

  // On touchstart: ask parent for its current scrollY so our
  // absolute-position math stays accurate across multiple gestures.
  document.addEventListener('touchstart', function (e) {
    lastY = e.touches[0].clientY;
    lastX = e.touches[0].clientX;
    window.parent.postMessage({ type: 'iframeScrollInit' }, '*');
  }, { passive: true });

  // Parent replies with its actual scrollY — keep our copy in sync.
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'iframeScrollAck') {
      parentScrollY = e.data.y;
      synced = true;
    }
  });

  document.addEventListener('touchmove', function (e) {
    if (!e.touches.length) return;
    var dy = lastY - e.touches[0].clientY;
    var dx = lastX - e.touches[0].clientX;
    lastY = e.touches[0].clientY;
    lastX = e.touches[0].clientX;

    // Only relay vertical-dominant gestures
    if (Math.abs(dy) <= Math.abs(dx)) return;

    parentScrollY = Math.max(0, parentScrollY + dy);
    window.parent.postMessage({ type: 'iframeScrollTo', y: parentScrollY }, '*');
  }, { passive: true });
}());
</script>
